name: Release installer

# Builds PulseDeck-<version>-Setup.exe and attaches it to a draft GitHub release.
# Runs only for version tags (git tag v1.0.0 && git push origin v1.0.0) or by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-optional.txt -r requirements-build.txt
      - name: Run all tests
        run: python -m unittest discover -s tests
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: python packaging/build.py
      - name: Publish draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem dist\PulseDeck-*-Setup.exe | Select-Object -First 1
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" $setup.FullName --clobber --repo "${{ github.repository }}"
          } else {
            gh release create "${{ github.ref_name }}" $setup.FullName --repo "${{ github.repository }}" `
              --title "PulseDeck ${{ github.ref_name }}" --draft `
              --notes "Установщик для Windows 10/11 (64-бит), Python не нужен. См. README.md, PRIVACY_POLICY.md и docs/BUILD.md."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: PulseDeck-Setup
          path: dist/PulseDeck-*-Setup.exe
